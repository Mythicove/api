openapi: 3.0.3
info:
  title: Mythic Isles API
  version: 0.1.0
  description: Optional server directory, game probes and integration management. Admin credentials never enter public responses.
servers:
  - url: http://localhost:8095
paths:
  /api/isles/catalog/modrinth/search:
    get:
      operationId: searchModrinthCatalog
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, maxLength: 120 } }
        - { in: query, name: loader, schema: { type: string, maxLength: 64 } }
        - { in: query, name: game_version, schema: { type: string, maxLength: 32 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Fixed-origin Modrinth project metadata; files are not mirrored.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogProject' } }
        '400': { description: Invalid query }
        '429': { description: Catalog upstream budget exhausted }
        '502': { description: Upstream unavailable or invalid }
  /api/isles/catalog/hangar/search:
    get:
      operationId: searchHangarCatalog
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, maxLength: 120 } }
        - { in: query, name: platform, schema: { type: string, maxLength: 32 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Fixed-origin Hangar project metadata; files are not mirrored.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogProject' } }
        '400': { description: Invalid query }
        '429': { description: Catalog upstream budget exhausted }
        '502': { description: Upstream unavailable or invalid }
  /api/isles/catalog/modrinth/versions/{project}:
    get:
      operationId: listModrinthVersions
      parameters:
        - { in: path, name: project, required: true, schema: { type: string } }
        - { in: query, name: loader, schema: { type: string, maxLength: 64 } }
        - { in: query, name: game_version, schema: { type: string, maxLength: 32 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Versions with upstream-declared file hashes, download URLs and compatibility.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogVersion' } }
        '400': { description: Invalid filters }
        '429': { description: Catalog upstream budget exhausted }
        '502': { description: Upstream unavailable or invalid }
  /api/isles/catalog/hangar/versions/{owner}/{project}:
    get:
      operationId: listHangarVersions
      parameters:
        - { in: path, name: owner, required: true, schema: { type: string } }
        - { in: path, name: project, required: true, schema: { type: string } }
        - { in: query, name: platform, schema: { type: string, maxLength: 32 } }
        - { in: query, name: game_version, schema: { type: string, maxLength: 32 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Versions and downloads on selected platforms; external-only artifacts have no direct download.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CatalogVersion' } }
        '400': { description: Invalid filters }
        '429': { description: Catalog upstream budget exhausted }
        '502': { description: Upstream unavailable or invalid }
  /api/isles/servers:
    get:
      operationId: listServers
      responses:
        '200':
          description: Published servers only; panel bindings and packwiz source are omitted.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Server' }
  /api/isles/servers/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getServer
      responses:
        '200':
          description: Published server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { description: Server unavailable }
  /api/isles/servers/{id}/status:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getGameStatus
      responses:
        '200':
          description: Game probe observation, cached for 20 seconds. Latency is from Isles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatus' }
        '404': { description: Server unavailable }
  /api/isles/packs/{version}:
    get:
      operationId: downloadPack
      parameters:
        - in: path
          name: version
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Hash-addressed published pack
          content:
            application/x-modrinth-modpack+zip:
              schema: { type: string, format: binary }
        '404': { description: Not attached to a published server }
  /api/isles/admin/config:
    get:
      operationId: getIslesConfig
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Configuration without connection tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      operationId: saveServer
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Server' }
      responses:
        '200':
          description: Saved server; packVersion is preserved by the server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { description: Invalid configuration }
        '401': { description: Service token required }
    delete:
      operationId: deleteServer
      security: [{ serviceToken: [] }]
      responses:
        '204': { description: Removed }
        '401': { description: Service token required }
  /api/isles/admin/connections/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      operationId: saveConnection
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Connection' }
                - type: object
                  properties:
                    token:
                      type: string
                      writeOnly: true
                      description: Omit to preserve existing secret; an empty value clears it.
      responses:
        '200':
          description: Saved connection without token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid connection }
        '401': { description: Service token required }
    delete:
      operationId: deleteConnection
      security: [{ serviceToken: [] }]
      responses:
        '204': { description: Removed }
        '409': { description: Connection is bound to a server }
        '401': { description: Service token required }
  /api/isles/admin/connections/{id}/instances:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: listPanelInstances
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Panel instances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instance' }
        '502': { description: Panel unavailable or rejected request }
        '401': { description: Service token required }
  /api/isles/admin/connections/{id}/metrics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getExporterMetrics
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Selected server-level Prometheus metrics
          content:
            application/json:
              schema:
                type: object
                required: [checkedAt, metrics]
                properties:
                  checkedAt: { type: string, format: date-time }
                  metrics:
                    type: array
                    items:
                      type: object
                      required: [name, labels, value]
                      properties:
                        name: { type: string }
                        labels: { type: object, additionalProperties: { type: string } }
                        value: { type: number }
        '502': { description: Exporter unavailable or invalid exposition }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}/runtime:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getPanelRuntime
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Process status, separate from game reachability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runtime' }
        '409': { description: No bound panel instance }
        '502': { description: Panel unavailable }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}/actions/{action}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [start, stop, restart, command] }
    post:
      operationId: controlInstance
      security: [{ serviceToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '202': { description: Accepted by the panel; poll runtime to confirm }
        '400': { description: Invalid action or command }
        '409': { description: No bound panel instance }
        '502': { description: Panel rejected request }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}/logs:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getRecentLogs
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Last 64KB of MCSManager log
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        '501': { description: Panel requires its WebSocket console }
        '502': { description: Panel unavailable }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}/publish-pack:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: publishPackwiz
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Verified immutable mrpack publication
          content:
            application/json:
              schema:
                type: object
                required: [version, path]
                properties:
                  version: { type: string }
                  path: { type: string }
        '400': { description: No configured source }
        '409': { description: Source changed during publication }
        '502': { description: Source unavailable, unsupported or failed hash validation }
        '401': { description: Service token required }
  /api/isles/admin/servers/{id}/bridge-token:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: rotateBridgeToken
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Server-specific token shown only on creation; old token is immediately revoked.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '401': { description: Administrator required }
  /api/isles/admin/servers/{id}/bridge:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getBridgeObservation
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Latest observation; fresh means received within 90 seconds.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, fresh]
                properties:
                  fresh: { type: boolean }
                  snapshot: { $ref: '#/components/schemas/BridgeSnapshot' }
        '409': { description: Bridge has not connected }
  /api/isles/admin/servers/{id}/identities:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: listVerifiedGameIdentities
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Verified website-player to game identities for this server
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [player, identity]
                  properties:
                    player: { type: string }
                    identity: { $ref: '#/components/schemas/GameIdentity' }
  /api/isles/admin/servers/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: listBridgeTasks
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Durable desired-state task results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BridgeTask' }
    post:
      operationId: setGameMembership
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, kind, grant]
              properties:
                player: { type: string }
                kind: { type: string, enum: [whitelist, member] }
                group: { type: string, description: Existing group reported by the Bridge }
                grant: { type: boolean }
      responses:
        '200':
          description: Queued, not yet applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeTask' }
        '409': { description: Verified identity, current Bridge observation or provider is missing }
  /api/isles/admin/servers/{id}/chunky:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: controlChunkyGeneration
      security: [{ serviceToken: [] }]
      description: Queue one generation operation for a reported loaded world. Start accepts square/circle and a radius in blocks; it never overwrites paused work. Applied means the plugin accepted the operation, not that generation completed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChunkyOperation' }
      responses:
        '200':
          description: Operation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeTask' }
        '400': { description: Invalid selection or unreported world }
        '401': { description: Administrator required }
        '409': { description: 'Bridge stale, provider unavailable, incompatible state or operation already pending' }
        '429': { description: Task capacity reached }
  /api/isles/players/{player}/pair:
    parameters:
      - { $ref: '#/components/parameters/player' }
    post:
      operationId: createGamePairing
      description: Web BFF verifies website session and ownership; direct Isles calls require service token and X-Isles-Player.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server: { type: string }
      responses:
        '200':
          description: One-time game linking code, valid for 10 minutes
          content:
            application/json:
              schema:
                type: object
                required: [code, command, expiresAt]
                properties:
                  code: { type: string }
                  command: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { description: Website-player ownership required }
  /api/isles/players/{player}/links:
    parameters:
      - { $ref: '#/components/parameters/player' }
    get:
      operationId: listOwnGameLinks
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Verified game identities with own online-player observations and stored Plan activity only
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [server, identity, fresh]
                  properties:
                    server: { type: string }
                    identity: { $ref: '#/components/schemas/GameIdentity' }
                    fresh: { type: boolean }
                    player: { $ref: '#/components/schemas/PlayerSnapshot' }
                    activity: { $ref: '#/components/schemas/PlanActivity' }
                    towny: { $ref: '#/components/schemas/TownyResident' }
  /api/isles/bridge/{id}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: observeGameBridge
      security: [{ bridgeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeSnapshot' }
      responses:
        '204': { description: Observation received }
        '401': { description: Server-specific Bridge token required }
  /api/isles/bridge/{id}/link:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: verifyGamePairing
      security: [{ bridgeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, uuid, name, platform]
              properties:
                code: { type: string }
                uuid: { type: string }
                name: { type: string }
                platform: { type: string, enum: [java, bedrock], description: Observed in the game server; never inferred from the player name }
      responses:
        '204': { description: Verified and consumed }
        '403': { description: Code expired, consumed or bound to another server }
        '409': { description: Game identity belongs to another website player }
  /api/isles/bridge/{id}/identities:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: listBridgeVerifiedUUIDs
      security: [{ bridgeToken: [] }]
      description: UUID allowlist for private offline statistics on this server; contains no website identities. Maximum 2000 verified identities; exceeding capacity fails explicitly.
      responses:
        '200':
          description: Verified game UUIDs belonging to this server
          content:
            application/json:
              schema: { type: array, maxItems: 2000, items: { type: string } }
        '401': { description: Server-specific token required }
        '409': { description: Verified identity capacity exceeded }
  /api/isles/bridge/{id}/tasks:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getPendingBridgeTasks
      security: [{ bridgeToken: [] }]
      responses:
        '200':
          description: Up to 10 pending tasks. Membership sets desired state; Chunky operations MUST be claimed before execution and must never be replayed after dispatch.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BridgeTask' }
  /api/isles/bridge/{id}/tasks/{task}/claim:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - in: path
        name: task
        required: true
        schema: { type: string }
    post:
      operationId: claimBridgeOperation
      security: [{ bridgeToken: [] }]
      description: Persist at-most-once dispatch of a Chunky operation before invoking the provider. A lost claim or result response leaves dispatched with an uncertain outcome; no automatic replay occurs, including after restart.
      responses:
        '204': { description: Dispatch persisted; this caller may execute once }
        '409': { description: Already dispatched or not a claimable operation; do not execute }
        '401': { description: Server-specific Bridge token required }
  /api/isles/bridge/{id}/tasks/{task}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - in: path
        name: task
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeBridgeTask
      security: [{ bridgeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [success]
              properties:
                success: { type: boolean }
                error: { type: string, maxLength: 500 }
      responses:
        '204': { description: Result persisted; repeated acknowledgement is idempotent }
        '409': { description: Chunky operation must be claimed first }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
    bridgeToken: { type: http, scheme: bearer, description: Server-specific token, never a service admin token }
  parameters:
    player:
      in: path
      name: player
      required: true
      schema: { type: string }
    id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
  schemas:
    CatalogFile:
      type: object
      required: [name, url, hashes, size]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        hashes: { type: object, additionalProperties: { type: string } }
        size: { type: integer, format: int64 }
        platform: { type: string }
    CatalogVersion:
      type: object
      required: [id, name, number, channel, gameVersions, loaders, files]
      properties:
        id: { type: string }
        name: { type: string }
        number: { type: string }
        channel: { type: string }
        gameVersions: { type: array, items: { type: string } }
        loaders: { type: array, items: { type: string } }
        files: { type: array, items: { $ref: '#/components/schemas/CatalogFile' } }
    CatalogProject:
      type: object
      required: [id, slug, title, source, url]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        projectType: { type: string }
        iconUrl: { type: string, format: uri }
        source: { type: string, enum: [modrinth, hangar] }
        url: { type: string, format: uri }
        downloads: { type: integer, format: int64 }
        categories: { type: array, items: { type: string } }
        loaders: { type: array, items: { type: string } }
        gameVersions: { type: array, items: { type: string } }
    GameIdentity:
      type: object
      required: [uuid, name, platform, linkedAt]
      properties:
        uuid: { type: string }
        name: { type: string }
        platform: { type: string, enum: [java, bedrock] }
        linkedAt: { type: string, format: date-time }
    PlayerSnapshot:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string }
        name: { type: string }
        group: { type: string }
        groups: { type: array, items: { type: string } }
        values: { type: object, additionalProperties: { type: string } }
        clientVersion: { type: string, description: Protocol version observed by ViaVersion for this online player }
        regions: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/GameRegion' } }
        regionsTruncated: { type: boolean, description: Additional matching regions were omitted }
        economy: { $ref: '#/components/schemas/GameEconomy' }
        connection: { $ref: '#/components/schemas/GameConnection' }
    GameConnection:
      type: object
      description: Owner/admin-only live Bedrock observation from an installed provider. UUID remains the actual Bukkit identity; no Xbox IDs or account tokens are exported. Presence is not an independent Xbox authentication attestation.
      required: [edition, provider, version, linkedJavaAccount]
      properties:
        edition: { type: string, enum: [bedrock] }
        provider: { type: string, enum: [geyser, floodgate] }
        version: { type: string, maxLength: 120 }
        linkedJavaAccount: { type: boolean, description: Provider-side Java-account linking; independent of this website's one-time game binding }
    CrossplaySnapshot:
      type: object
      description: Administrator-only Geyser-supported versions; these are not a guarantee of proxy/authentication/mod compatibility.
      required: [javaVersion, bedrockVersions]
      properties:
        javaVersion: { type: string, maxLength: 120 }
        bedrockVersions: { type: array, minItems: 1, maxItems: 64, items: { type: string, maxLength: 120 } }
    GameEconomy:
      type: object
      required: [provider, balance, formatted, currency]
      properties:
        provider: { type: string }
        balance: { type: number }
        formatted: { type: string }
        currency: { type: string }
    GameRegion:
      type: object
      required: [id, world, role, centerX, centerY, centerZ]
      properties:
        id: { type: string }
        world: { type: string }
        role: { type: string, enum: [owner, member] }
        centerX: { type: integer }
        centerY: { type: integer }
        centerZ: { type: integer }
    BridgeSnapshot:
      type: object
      required: [platform, minecraft, plugins, groups, players, receivedAt]
      properties:
        platform: { type: string }
        minecraft: { type: string }
        plugins: { type: object, additionalProperties: { type: string } }
        groups: { type: array, maxItems: 500, items: { type: string } }
        players: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/PlayerSnapshot' } }
        tps: { type: number }
        mspt: { type: number }
        cpu: { type: number, description: Fraction of system CPU usage }
        receivedAt: { type: string, format: date-time, readOnly: true }
        protocolVersions: { type: array, maxItems: 256, items: { type: string }, description: ViaVersion-supported protocols after configured blocks; does not guarantee proxy/modpack compatibility }
        chunky: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ChunkyWorld' }, description: Administrator-only loaded worlds and Chunky task state; absent if unavailable }
        plan: { $ref: '#/components/schemas/PlanSnapshot' }
        towny: { $ref: '#/components/schemas/TownySnapshot' }
        crossplay: { $ref: '#/components/schemas/CrossplaySnapshot' }
    TownyReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Stable provider UUID }
        name: { type: string, maxLength: 256 }
    TownyTown:
      type: object
      required: [id, name, residents, claimedTownBlocks, open, public]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 256 }
        residents: { type: integer, minimum: 0 }
        claimedTownBlocks: { type: integer, minimum: 0, description: Provider townblock count; not an assumed block area or map polygon }
        open: { type: boolean, description: Towny open-join flag; not a website join action }
        public: { type: boolean, description: Towny public-spawn flag; not permission to publish the town on this website }
        nation: { $ref: '#/components/schemas/TownyReference' }
    TownyNation:
      type: object
      required: [id, name, towns, residents, open, public]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 256 }
        towns: { type: integer, minimum: 0 }
        residents: { type: integer, minimum: 0 }
        open: { type: boolean }
        public: { type: boolean, description: Provider public-spawn flag }
    TownyResident:
      type: object
      description: Owner-only verified resident membership, including offline residents. Present without town means a known townless resident; absence means unavailable or unknown resident.
      required: [uuid, mayor, king, townRanks, nationRanks, observedAt]
      properties:
        uuid: { type: string }
        mayor: { type: boolean }
        king: { type: boolean }
        townRanks: { type: array, maxItems: 32, items: { type: string, maxLength: 120 } }
        nationRanks: { type: array, maxItems: 32, items: { type: string, maxLength: 120 } }
        town: { $ref: '#/components/schemas/TownyTown' }
        observedAt: { type: string, format: date-time }
    TownySnapshot:
      type: object
      description: Administrator-only provider towns/nations and verified resident rows. Lists retain at most 100 towns and 100 nations in UUID order; counts describe the complete provider lists, not the retained page. No resident directory or spawn coordinates are exported.
      required: [townCount, nationCount, towns, nations, residents, observedAt]
      properties:
        townCount: { type: integer, minimum: 0 }
        nationCount: { type: integer, minimum: 0 }
        towns: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TownyTown' } }
        nations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TownyNation' } }
        residents: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/TownyResident' } }
        observedAt: { type: string, format: date-time }
    PlanActivity:
      type: object
      description: Stored Plan sessions for one verified UUID on the current game server; available while offline. Does not include an unsaved current session.
      required: [uuid, sessions, playtimeMs, afkMs, firstSeen, lastSeen, observedAt]
      properties:
        uuid: { type: string }
        sessions: { type: integer, format: int64, minimum: 1 }
        playtimeMs: { type: integer, format: int64, minimum: 0, description: Stored session duration including AFK }
        afkMs: { type: integer, format: int64, minimum: 0 }
        firstSeen: { type: string, format: date-time, description: Earliest stored session start }
        lastSeen: { type: string, format: date-time, description: Latest stored session end; not live presence }
        observedAt: { type: string, format: date-time }
    PlanSnapshot:
      type: object
      description: Administrator-only Plan aggregate scoped by the provider's current server UUID. Individual rows include verified UUIDs only; absent when provider/query is unavailable.
      required: [serverUUID, recordedPlayers, sessions, playtimeMs, afkMs, observedAt, players]
      properties:
        serverUUID: { type: string }
        recordedPlayers: { type: integer, format: int64, minimum: 0, description: Distinct players with stored sessions on this server }
        sessions: { type: integer, format: int64, minimum: 0 }
        playtimeMs: { type: integer, format: int64, minimum: 0 }
        afkMs: { type: integer, format: int64, minimum: 0 }
        observedAt: { type: string, format: date-time }
        players: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/PlanActivity' } }
    ChunkyWorld:
      type: object
      required: [world, state]
      properties:
        world: { type: string }
        state: { type: string, enum: [idle, running, paused, completed, cancelled, stopped], description: Stopped means the saved terminal checkpoint cannot establish completion versus cancellation after a restart }
        selection:
          type: object
          required: [shape, centerX, centerZ, radiusX, radiusZ]
          properties:
            shape: { type: string }
            centerX: { type: number }
            centerZ: { type: number }
            radiusX: { type: number }
            radiusZ: { type: number }
        progress:
          type: object
          required: [chunks, total, percent]
          properties:
            chunks: { type: integer, format: int64, minimum: 0 }
            total: { type: integer, format: int64, minimum: 0 }
            percent: { type: number, minimum: 0, maximum: 100 }
            rate: { type: number, minimum: 0, description: Plugin estimate in chunks per second; only available while running }
            etaSeconds: { type: integer, format: int64, minimum: 0, description: Plugin ETA while running; never completion elapsed time }
    ChunkyOperation:
      type: object
      required: [world, action]
      properties:
        world: { type: string, maxLength: 256, description: Loaded world reported by the Bridge }
        action: { type: string, enum: [start, pause, continue, cancel] }
        shape: { type: string, enum: [square, circle], description: Required for start }
        centerX: { type: number, description: Defaults to zero }
        centerZ: { type: number, description: Defaults to zero }
        radius: { type: number, minimum: 1, maximum: 100000, description: 'Required for start; blocks, also bounded by the server Chunky radius limit' }
    BridgeTask:
      type: object
      required: [id, kind, uuid, grant, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [whitelist, member, chunky] }
        uuid: { type: string }
        group: { type: string }
        grant: { type: boolean }
        status: { type: string, enum: [pending, dispatched, applied, failed], description: Dispatched means claimed with no result yet; an interrupted operation is never automatically replayed }
        chunky: { $ref: '#/components/schemas/ChunkyOperation' }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    Link:
      type: object
      required: [kind, url, label]
      properties:
        kind: { type: string }
        url: { type: string, format: uri }
        label: { type: string }
    Server:
      type: object
      required: [id, name, description, address, edition, published, links]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        address: { type: string, description: 'host:port, IPv6 enclosed in brackets' }
        edition: { type: string, enum: [java, bedrock] }
        coverUrl: { type: string, format: uri }
        links: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Link' } }
        published: { type: boolean }
        connectionId: { type: string, description: Admin only }
        daemonId: { type: string, description: Admin only }
        instanceId: { type: string, description: Admin only }
        packwizUrl: { type: string, format: uri, description: Admin only }
        packVersion: { type: string, readOnly: true }
        map: { $ref: '#/components/schemas/WorldMap' }
    WorldMap:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [bluemap, squaremap, dynmap] }
        url: { type: string, format: uri, description: Browser-facing map URL; may retain a saved camera-location fragment }
    Connection:
      type: object
      required: [id, name, kind, url, configured]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [mcsm, pterodactyl, prometheus] }
        url: { type: string, format: uri }
        configured: { type: boolean, readOnly: true }
    Config:
      type: object
      required: [servers, connections]
      properties:
        servers: { type: array, items: { $ref: '#/components/schemas/Server' } }
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
    GameStatus:
      type: object
      required: [reachable, checkedAt, latencyMs]
      properties:
        reachable: { type: boolean }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer }
        players: { type: integer }
        maxPlayers: { type: integer }
        version: { type: string }
        motd: { type: string }
        error: { type: string }
    Instance:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        daemonId: { type: string }
    Runtime:
      type: object
      required: [state, checkedAt]
      properties:
        state: { type: string }
        checkedAt: { type: string, format: date-time }
        cpuPercent: { type: number }
        memoryBytes: { type: integer }
