            type: string
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/audit:
    get:
      operationId: adminListAudit
      summary: 管理操作审计日志（时间倒序）
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: 按 action/actor/target 模糊过滤
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
