openapi: 3.1.0
info:
  title: Mythic Mirror API
  version: 0.2.0
  description: |
    皮肤站契约，对齐 authlib-injector 的 Yggdrasil 服务端规范，外加账号体系、皮肤库与管理后台。

    本契约只描述当前后端真正实现的路由（受 mythic-mirror 仓库的 spec 漂移测试保护）。
    OIDC Provider 端点（/oauth2/*、/.well-known/*）遵循 OAuth2/OIDC 标准，
    自描述见 /.well-known/openid-configuration，暂不在本契约中重复建模。
servers:
  - url: /
paths:
  /:
    get:
      operationId: getMeta
      summary: 根 meta 端点
      description: 返回服务元信息，供客户端发现签名公钥与皮肤域名。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /authserver/authenticate:
    post:
      operationId: authenticate
      summary: 账号密码认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/refresh:
    post:
      operationId: refresh
      summary: 刷新访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/validate:
    post:
      operationId: validate
      summary: 校验访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "204":
          description: 令牌有效
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/invalidate:
    post:
      operationId: invalidate
      summary: 使令牌失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvalidateRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/signout:
    post:
      operationId: signout
      summary: 退出登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignoutRequest"
      responses:
        "204":
          description: OK
  /sessionserver/session/minecraft/join:
    post:
      operationId: join
      summary: 记录 serverId 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /sessionserver/session/minecraft/hasJoined:
    get:
      operationId: hasJoined
      summary: 服务端换取玩家资料
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
        - name: serverId
          in: query
          required: true
          schema:
            type: string
        - name: ip
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 已加入，返回带签名的 profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 尚未加入
  /sessionserver/session/minecraft/profile/{uuid}:
    get:
      operationId: getProfile
      summary: 按 UUID 取 profile
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: unsigned
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 无此 profile
  /api/profiles/minecraft:
    post:
      operationId: queryProfiles
      summary: 批量 name → UUID 查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items:
                type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /skin/{name}:
    get:
      operationId: getSkin
      summary: 按玩家名下载皮肤
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadSkin
      summary: 上传皮肤（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
            enum: [default, slim]
            default: default
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "413":
          description: 超出存储配额（QuotaExceededException）
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /cape/{name}:
    get:
      operationId: getCape
      summary: 按玩家名下载披风
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadCape
      summary: 上传披风（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /textures/{key}:
    get:
      operationId: getTexture
      summary: 按存储键取纹理原图
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /avatars/{uuid}:
    get:
      operationId: getAvatar
      summary: crafatar 兼容 2D 头像
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: 头像边长（像素）
          schema:
            type: integer
            default: 128
      responses:
        "200":
          description: 头像 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /avatars/by-name/{name}:
    get:
      operationId: getAvatarByName
      summary: 按玩家名出 2D 头像（列表/评论等仅有名字的场景）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 128
      responses:
        "200":
          description: 头像 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/head/{uuid}:
    get:
      operationId: getHeadRender
      summary: 2D 头部渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/body/{uuid}:
    get:
      operationId: getBodyRender
      summary: 2D 全身渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /usm/{uuid}:
    get:
      operationId: getUSM
      summary: USM（统一皮肤材质）端点
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftSkins/{name}:
    get:
      operationId: getLegacySkin
      summary: 旧版皮肤直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftCloaks/{name}:
    get:
      operationId: getLegacyCape
      summary: 旧版披风直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /healthz:
    get:
      operationId: healthz
      summary: 健康检查
      responses:
        "200":
          description: OK
  /account/register:
    post:
      operationId: register
      summary: 注册账号（发送验证邮件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /account/login:
    post:
      operationId: accountLogin
      summary: web 登录（login scope 启用时强制验证码）
      description: |
        供 web BFF（`/api/auth/login` 路由处理器）调用，不是浏览器直接端点。
        与 Yggdrasil 的 /authserver/authenticate 的区别：`MIRROR_CAPTCHA_SCOPES` 含 login 时
        强制校验 captchaToken；启动器等协议客户端请继续走 /authserver/authenticate（永不强制验证码）。
        与 /authserver/authenticate 共用按 IP 的 "auth" 限流桶。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK（形状同 /authserver/authenticate）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "503":
          $ref: "./common.yaml#/components/responses/Error"
  /account/verify:
    post:
      operationId: verifyEmail
      summary: 用邮件中的 token 验证邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: 已验证
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/forgot-password:
    post:
      operationId: forgotPassword
      summary: 发送密码重置邮件（不泄露账号是否存在）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "204":
          description: OK
  /account/reset-password:
    post:
      operationId: resetPassword
      summary: 用重置 token 设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: OK
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players:
    get:
      operationId: listPlayers
      summary: 当前账号名下玩家列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: addPlayer
      summary: 为当前账号添加玩家名
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players/{name}:
    patch:
      operationId: renamePlayer
      summary: 玩家改名
      description: |
        离线 UUID 由名字派生，改名会同时更换 uuid，并使该玩家的游戏会话与服务器绑定失效
        （启动器需重新登录）。已绑定微软正版的玩家（名字来自 Mojang）返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 新名字
      responses:
        "200":
          description: 已改名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          description: 新名字已被占用，或该玩家已绑定正版
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    delete:
      operationId: deletePlayer
      summary: 删除玩家（连同其会话与服务器绑定）
      description: 账号至少保留一个玩家，删除唯一玩家返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          description: 不能删除账号下唯一的玩家
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /account/players/{name}/activate:
    post:
      operationId: activatePlayer
      summary: 设为当前玩家（建会话时优先使用）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "204":
          description: 已设为当前玩家
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players/{name}/premium:
    delete:
      operationId: unbindPremium
      summary: 解除微软正版绑定
      description: |
        清空该玩家的 premium_uuid，回到离线身份：此后可以本地改名，贴图不再回退 Mojang。
        幂等——未绑定时同样返回 204。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "204":
          description: 已解绑（或本就未绑定）
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /oauth/{provider}/auth:
    get:
      operationId: oauthAuth
      summary: 跳转到第三方 OAuth 授权页
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: 登录完成后的前端回跳 URL
          schema:
            type: string
      responses:
        "302":
          description: 跳转到授权页
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      summary: OAuth 回调（state 为 URL 时 302 回跳，query 携带一次性 oauth_code）
      description: |
        回跳不再在 URL fragment 里携带会话令牌（令牌会留在浏览历史且落地页脚本可读）。
        改为发放一次性、短时效（60s、单次消费）的 `oauth_code`，由 web 的服务端路由
        调 `POST /account/exchange-code` 兑换会话并直接落 httpOnly cookie。
        失败时回跳带 `?oauth=error`。
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 无回跳 URL 时直接返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "302":
          description: 回跳前端（`?oauth_code=<一次性码>`，失败时 `?oauth=error`）
  /account/exchange-code:
    post:
      operationId: exchangeOAuthCode
      summary: 用一次性换取码兑换会话
      description: |
        调用方是 web 的服务端路由（BFF），不是浏览器。换取码单次消费，重放返回 401。
        返回的 accessToken 由调用方写入 httpOnly cookie，不回浏览器 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: 兑换成功
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
                  playerName:
                    type: string
                    description: 当前玩家名（无玩家时省略）
                  playerId:
                    type: string
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          description: 换取码无效、已过期或已被消费
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /mojang/oauth/auth:
    get:
      operationId: mojangOauthAuth
      summary: 获取 Microsoft 正版绑定授权 URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /mojang/oauth/callback:
    get:
      operationId: mojangOauthCallback
      summary: Microsoft 正版绑定回调
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已绑定
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /mojang/verify:
    post:
      operationId: mojangVerify
      summary: 正版账号验证
      security:
        - bearerAuth: []
      responses:
        "204":
          description: OK
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib:
    get:
      operationId: listSkinlib
      summary: 皮肤库列表（搜索/排序/分页）
      parameters:
        - name: q
          in: query
          required: false
          description: 关键词（匹配玩家名/描述）
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinLibPage"
    post:
      operationId: publishSkin
      summary: 把玩家当前皮肤发布到皮肤库
      security:
        - bearerAuth: []
      requestBody:
        required: true
