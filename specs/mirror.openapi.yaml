          content:
            application/json:
              schema:
                type: object
                required: [entries, total]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /reports:
    post:
      operationId: createReport
      summary: 举报皮肤条目或评论（登录用户；同一目标仅一次）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetID]
              properties:
                targetType:
                  type: string
                  enum: [skin, comment]
                targetID:
                  type: string
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: 已受理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: 重复举报
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /api/admin/reports:
    get:
      operationId: adminListReports
      summary: 举报列表（pending 优先；status 过滤 pending|dismissed|acted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reports, total]
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/reports/{id}/resolve:
    post:
      operationId: adminResolveReport
      summary: 标记举报处理结果（删除目标内容复用 skinlib/comments DELETE 端点）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [dismissed, acted]
      responses:
        "204":
          description: 已处理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins:
    get:
      operationId: adminListSkins
      summary: 管理端皮肤列表（status 过滤 listed|under_review|unlisted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkinLibItem"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins/{id}/status:
    post:
      operationId: adminSetSkinStatus
      summary: 设置皮肤条目状态（批准上架/下架/退回审核）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [listed, unlisted, under_review]
      responses:
        "204":
          description: 已更新
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/oauth-clients:
    get:
      operationId: adminListOAuthClients
      summary: 列出 OIDC 客户端
      description: |
        返回存储态客户端，含 `secret_hash`（sha256 hex，非明文）与 `first_party` 标记。
        读取者即能创建/轮换客户端的管理员，故不构成额外提权；但客户端密钥应使用高熵随机值，
        以免哈希被离线爆破。
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthClient"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: adminSaveOAuthClient
      summary: 新建或更新 OIDC 客户端（按 id upsert，整个对象覆盖）
      description: |
        按 `id` upsert：命中则**整条替换**，故更新时必须带上不想丢失的字段
        （包括 `secret_hash`；省略即视为清空/转 public）。
        `public: true` 时服务端强制清空 `secret_hash`。
        `first_party: true` 的客户端授权时跳过前端同意页（用于同部署自有服务，如 Hoard）。
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClient"
      responses:
        "201":
          description: 已保存（回显存储态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/oauth-clients/{id}:
    delete:
      operationId: adminDeleteOAuthClient
      summary: 删除 OIDC 客户端
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: 已删除
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /admin/batch-import:
    post:
      operationId: adminBatchImport
      summary: 批量导入用户（随机密码，需管理员 token）
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                      nickname:
                        type: string
                      playerName:
                        type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "403":
          $ref: "./common.yaml#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Yggdrasil accessToken（会话）
    adminToken:
      type: http
      scheme: bearer
      description: MIRROR_ADMIN_TOKEN
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    PlayerName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: 玩家名（当前账号名下）
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, playerName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nickname:
          type: string
        playerName:
          type: string
        captchaToken:
          type: string
        inviteCode:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        captchaToken:
          type: string
          description: login scope 启用时必填；其余场景忽略
    SkinLibItem:
      type: object
      required: [id, owner_user_id, player_name, texture_key, description, model, likes, status, created_at]
      properties:
        id:
          type: string
        owner_user_id:
          type: string
        player_name:
          type: string
        texture_key:
          type: string
        description:
          type: string
        model:
          type: string
          enum: [default, slim]
        likes:
          type: integer
        status:
          type: string
          enum: [listed, under_review, unlisted]
        created_at:
          type: string
          description: RFC3339 时间戳
    Report:
      type: object
      required: [id, reporter_user_id, reporter_name, target_type, target_id, reason, status, reviewed_by, created_at]
      properties:
        id:
          type: string
        reporter_user_id:
          type: string
        reporter_name:
          type: string
        target_type:
          type: string
          enum: [skin, comment]
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, dismissed, acted]
        reviewed_by:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
        reviewed_at:
          type: string
          description: RFC3339 时间戳（未处理时缺省）
    SkinLibPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkinLibItem"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
    SkinComment:
      type: object
      required: [id, item_id, user_id, author_name, content, created_at]
      properties:
        id:
          type: string
        item_id:
          type: string
        user_id:
          type: string
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AuditEntry:
      type: object
      required: [id, actor, actor_ip, action, target, detail, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
          description: '"token" 或 "user:<id>"'
        actor_ip:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AdminUser:
      type: object
      required: [id, email, nickname, role, status, verified, created_at, player_names]
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, banned, suspended]
        verified:
          type: boolean
        created_at:
          type: string
        player_names:
          type: array
          items:
            type: string
    RegisterRequirements:
      type: object
      required: [registrationDisabled, inviteOnly, captcha, captchaSiteKey, captchaCapUrl, captchaScopes, minPasswordLength, emailDomains]
      properties:
        registrationDisabled:
          type: boolean
        inviteOnly:
          type: boolean
        captcha:
          type: string
          description: turnstile | recaptcha | hcaptcha | cap | 空串（不启用）
        captchaSiteKey:
          type: string
        captchaCapUrl:
          type: string
          description: cap driver 的 Standalone 实例公网地址（前端加载控件用）；其余 driver 为空串
        captchaScopes:
          type: array
          description: 验证码保护范围（register | login）；前端据此决定注册/登录页是否渲染控件。验证码未生效时为空数组
          items:
            type: string
        minPasswordLength:
          type: integer
          description: 密码最小长度（与后端 account.MinPasswordLength 同源）
        emailDomains:
          type: array
          description: 允许的邮箱域名；空数组表示不限制
          items:
            type: string
    OAuthClient:
      type: object
      required: [id, name, redirect_uris, grant_types, scopes, public]
      properties:
        id:
          type: string
        name:
          type: string
        secret_hash:
          type: string
          description: 客户端密钥的 sha256 hex；public 客户端为空。服务端不存也不回传明文
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        public:
          type: boolean
        first_party:
          type: boolean
          description: 同部署第一方服务（如 Hoard）；授权时免前端同意页
    LoginMethod:
      type: object
      required: [id, type, label, enabled, order]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [password, oauth]
        label:
          type: string
        enabled:
          type: boolean
        order:
          type: integer
    Announcement:
      type: object
      required: [title, body, enabled]
      properties:
        title:
          type: string
        body:
          type: string
        enabled:
          type: boolean
    BrandConfig:
      type: object
      required: [light, dark, version]
      properties:
        light:
          type: boolean
          description: 浅色图标是否被自定义
        dark:
          type: boolean
          description: 深色图标是否被自定义
        version:
          type: integer
          description: 变更版本号，前端用作缓存击穿查询串
    SiteInfo:
      type: object
      required: [name, description, copyright, icp]
      properties:
        name:
          type: string
        description:
          type: string
        copyright:
          type: string
        icp:
          type: string
          description: 备案展示文本（中国部署）
    SiteAssets:
      type: object
      required: [customCss, customJs]
      properties:
        customCss:
          type: string
        customJs:
          type: string
    SitePublic:
      type: object
      required: [name, description, copyright, icp, customCss, customJs]
      properties:
        name:
          type: string
        description:
          type: string
        copyright:
          type: string
        icp:
          type: string
        customCss:
          type: boolean
        customJs:
          type: boolean
    SiteAdmin:
      type: object
      required: [info, assets]
      properties:
        info:
          $ref: "#/components/schemas/SiteInfo"
        assets:
          $ref: "#/components/schemas/SiteAssets"
    Meta:
      type: object
      properties:
        meta:
          type: object
          properties:
            serverName:
              type: string
            implementationName:
              type: string
            implementationVersion:
              type: string
        skinDomains:
          type: array
          items:
            type: string
        signaturePublickey:
          type: string
          description: base64 编码的 PEM 公钥
    AuthenticateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        clientToken:
          type: string
        requestUser:
          type: boolean
          default: false
        agent:
          type: object
          properties:
            name:
              type: string
              default: Minecraft
            version:
              type: integer
    Profile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    Property:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
          description: base64 编码的 textures JSON
        signature:
          type: string
          description: base64 编码的 RSA 签名
    Textures:
      type: object
      description: textures 属性的解码结构
      properties:
        timestamp:
          type: integer
          format: int64
        profileId:
          type: string
        profileName:
          type: string
        textures:
          type: object
          properties:
            SKIN:
              type: object
              properties:
                url:
                  type: string
                metadata:
                  type: object
                  properties:
                    model:
                      type: string
                      enum: [slim, default]
            CAPE:
              type: object
              properties:
                url:
                  type: string
    Player:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        legacy:
          type: boolean
        demo:
          type: boolean
        active:
          type: boolean
          description: 是否为账号当前选用的玩家（建会话时优先使用）
        premium:
          type: boolean
          description: 是否已绑定微软正版（绑定后不可本地改名）
    AuthenticateResponse:
      type: object
      required: [accessToken, clientToken, availableProfiles]
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        availableProfiles:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
            properties:
              type: array
              items:
                $ref: "#/components/schemas/Property"
    RefreshRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
    ValidateRequest:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    InvalidateRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    SignoutRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    JoinRequest:
      type: object
      required:
        - accessToken
        - selectedProfile
        - serverId
      properties:
        accessToken:
          type: string
        selectedProfile:
          type: string
        serverId:
          type: string
