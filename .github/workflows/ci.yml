name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: spec parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yaml parse
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("specs/*.yaml")):
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print(f"ok  {f}")
              except Exception as e:
                  bad = 1
                  print(f"ERR {f}: {e}")
          sys.exit(bad)
          EOF
      - name: note
        run: |
          echo "契约↔实现一致性由各服务仓库的漂移测试保证："
          echo "  mythic-mirror / mythic-hoard: TestSpecMatchesRoutes"
          echo "  web: pnpm gen:api + git diff --exit-code"
