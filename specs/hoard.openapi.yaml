openapi: 3.1.0
info:
  title: Mythic Hoard API
  version: 0.2.0
  description: |
    Mod 托管契约。读端点对齐 Modrinth API v2 的**已实现子集**，字段名与 Modrinth 保持一致，
    以让 Prism Launcher / ferium / packwiz 等客户端接入。

    本契约只描述**当前后端真正实现**的路由（受各服务仓库的 spec 漂移测试保护）。
    Modrinth 的批量端点（/v2/projects、/v2/versions、/v2/version_files）、依赖关系、
    用户/团队/组织等尚未实现，未列入本契约，待实现后再补。
servers:
  - url: /
tags:
  - name: search
  - name: project
  - name: version
  - name: tag
  - name: admin
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthz
      summary: 健康检查
      responses:
        "200":
          description: OK
  /auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      summary: 发起 OIDC 登录（302 跳转 IdP 授权端点；state/nonce 存短期 httpOnly cookie）
      responses:
        "302":
          description: 跳转授权端点
        "404":
          description: 未配置 OIDC
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: OIDC 回调（校验 state/nonce → 换 token → upsert 用户投影 → 设会话 cookie）
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 登录成功，跳回站点根
        "400":
          description: state 不匹配或缺参
        "403":
          description: 用户拒绝授权
        "502":
          description: token 交换或 ID token 校验失败
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 登出（删除服务端会话并清 cookie）
      responses:
        "204":
          description: 已登出
  /auth/me:
    get:
      operationId: me
      tags: [auth]
      summary: 当前登录用户投影
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未登录
  /v2/search:
    get:
      operationId: search
      tags: [search]
      summary: 全文 + facets 搜索（仅返回 listed 项目）
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: facets
          in: query
          required: false
          description: JSON 编码的 facets 数组，如 [["categories:forge"],["versions:1.20.1"]]
          schema:
            type: string
        - name: loaders
          in: query
          required: false
          description: 逗号分隔的 loader 列表
          schema:
            type: string
        - name: game_versions
          in: query
          required: false
          description: 逗号分隔的游戏版本列表
          schema:
            type: string
        - name: categories
          in: query
          required: false
          description: 逗号分隔的分类列表
          schema:
            type: string
        - name: project_type
          in: query
          required: false
          description: 逗号分隔的项目类型列表
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /api/mods:
    get:
      operationId: listMods
      tags: [search]
      summary: 项目列表/搜索（/v2/search 的别名，参数一致）
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
    post:
      operationId: uploadMod
      tags: [admin]
      summary: 上传 mod/整合包（需管理员 token）
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
                body:
                  type: string
                project_type:
                  type: string
                client_side:
                  type: string
                server_side:
                  type: string
                loaders:
                  type: string
                  description: 逗号分隔
                game_versions:
                  type: string
                  description: 逗号分隔
                categories:
                  type: string
                  description: 逗号分隔
                name:
                  type: string
                version_number:
                  type: string
                version_type:
                  type: string
                changelog:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/mods/{id}:
    get:
      operationId: getMod
      tags: [project]
      summary: 按 id/slug 取项目（/v2/project/{id} 的别名）
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMod
      tags: [admin]
      summary: 删除项目（需管理员 token）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: 已删除
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/mods/{id}/status:
    patch:
      operationId: setModStatus
      tags: [admin]
      summary: 更新审核状态（需管理员 token）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [listed, under_review, rejected, archived]
      responses:
        "204":
          description: 已更新
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/mods/{id}/download:
    get:
      operationId: downloadMod
      tags: [project]
      summary: 下载最新版本的主文件
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /api/mods/{id}/version/{vid}/file/{fid}:
    get:
      operationId: downloadModFile
      tags: [version]
      summary: 下载指定版本的指定文件
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: vid
          in: path
          required: true
          schema:
            type: string
        - name: fid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /v2/project/{id}:
    get:
      operationId: getProject
      tags: [project]
      summary: 按 id 或 slug 取项目
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
  /v2/project/{id}/version:
    get:
      operationId: getProjectVersions
      tags: [version]
      summary: 取项目的所有版本（含文件 URL）
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/Error"
  /v2/version/{id}:
    get:
      operationId: getVersion
      tags: [version]
      summary: 按 id 取版本
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/Error"
  /v2/project/{id}/version/{vid}/mrpack:
    get:
      operationId: getMrpack
      tags: [version]
      summary: 生成 .mrpack 整合包（modrinth.index.json）
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: vid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: .mrpack（zip）
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /v2/tag/category:
    get:
      operationId: getCategories
      tags: [tag]
      summary: 取分类名称列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/tag/loader:
    get:
      operationId: getLoaders
      tags: [tag]
      summary: 取 loader 名称列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v2/tag/game_version:
    get:
      operationId: getGameVersions
      tags: [tag]
      summary: 取游戏版本名称列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: HOARD_ADMIN_TOKEN
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      description: 项目 id 或 slug
      schema:
        type: string
  responses:
    Error:
      description: 错误响应（纯文本或 JSON）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HoardError"
  schemas:
    HoardError:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      required: [sub, username, email, avatar_url, role]
      properties:
        sub:
          type: string
          description: OIDC subject（Mirror 用户 ID）
        username:
          type: string
        email:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          enum: [user, admin]
    SearchResponse:
      type: object
      required: [hits, offset, limit, total_hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        offset:
          type: integer
        limit:
          type: integer
        total_hits:
          type: integer
          format: int64
    Project:
      type: object
      required: [id, slug, title, project_type]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: string
        project_type:
          type: string
        client_side:
          type: string
        server_side:
          type: string
        status:
          type: string
          enum: [listed, under_review, rejected, archived]
        downloads:
          type: integer
          format: int64
        follows:
          type: integer
          format: int64
        published:
          type: string
          description: RFC3339 时间戳；未发布时为空字符串
        loaders:
          type: array
          items:
            type: string
        game_versions:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
    Version:
      type: object
      required: [id, project_id, version_number]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        version_number:
          type: string
        version_type:
          type: string
          enum: [release, beta, alpha]
        changelog:
          type: string
        loaders:
          type: array
          items:
            type: string
        game_versions:
          type: array
          items:
            type: string
        date_published:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    File:
      type: object
      properties:
        hashes:
          type: object
          properties:
            sha1:
              type: string
            sha512:
              type: string
        url:
          type: string
        filename:
          type: string
        primary:
          type: boolean
        size:
          type: integer
          format: int64
