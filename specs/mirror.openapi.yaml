openapi: 3.1.0
info:
  title: Mythic Mirror API
  version: 0.2.0
  description: |
    皮肤站契约，对齐 authlib-injector 的 Yggdrasil 服务端规范，外加账号体系、皮肤库与管理后台。

    本契约只描述当前后端真正实现的路由（受 mythic-mirror 仓库的 spec 漂移测试保护）。
    OIDC Provider 端点（/oauth2/*、/.well-known/*）遵循 OAuth2/OIDC 标准，
    自描述见 /.well-known/openid-configuration，暂不在本契约中重复建模。
servers:
  - url: /
paths:
  /:
    get:
      operationId: getMeta
      summary: 根 meta 端点
      description: 返回服务元信息，供客户端发现签名公钥与皮肤域名。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /authserver/authenticate:
    post:
      operationId: authenticate
      summary: 账号密码认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/refresh:
    post:
      operationId: refresh
      summary: 刷新访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/validate:
    post:
      operationId: validate
      summary: 校验访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "204":
          description: 令牌有效
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/invalidate:
    post:
      operationId: invalidate
      summary: 使令牌失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvalidateRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/signout:
    post:
      operationId: signout
      summary: 退出登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignoutRequest"
      responses:
        "204":
          description: OK
  /sessionserver/session/minecraft/join:
    post:
      operationId: join
      summary: 记录 serverId 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /sessionserver/session/minecraft/hasJoined:
    get:
      operationId: hasJoined
      summary: 服务端换取玩家资料
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
        - name: serverId
          in: query
          required: true
          schema:
            type: string
        - name: ip
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 已加入，返回带签名的 profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 尚未加入
  /sessionserver/session/minecraft/profile/{uuid}:
    get:
      operationId: getProfile
      summary: 按 UUID 取 profile
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: unsigned
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 无此 profile
  /api/profiles/minecraft:
    post:
      operationId: queryProfiles
      summary: 批量 name → UUID 查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items:
                type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /skin/{name}:
    get:
      operationId: getSkin
      summary: 按玩家名下载皮肤
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadSkin
      summary: 上传皮肤（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
            enum: [default, slim]
            default: default
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "413":
          description: 超出存储配额（QuotaExceededException）
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /cape/{name}:
    get:
      operationId: getCape
      summary: 按玩家名下载披风
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadCape
      summary: 上传披风（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /textures/{key}:
    get:
      operationId: getTexture
      summary: 按存储键取纹理原图
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /avatars/{uuid}:
    get:
      operationId: getAvatar
      summary: crafatar 兼容 2D 头像
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: 头像边长（像素）
          schema:
            type: integer
            default: 128
      responses:
        "200":
          description: 头像 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/head/{uuid}:
    get:
      operationId: getHeadRender
      summary: 2D 头部渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/body/{uuid}:
    get:
      operationId: getBodyRender
      summary: 2D 全身渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /usm/{uuid}:
    get:
      operationId: getUSM
      summary: USM（统一皮肤材质）端点
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftSkins/{name}:
    get:
      operationId: getLegacySkin
      summary: 旧版皮肤直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftCloaks/{name}:
    get:
      operationId: getLegacyCape
      summary: 旧版披风直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /healthz:
    get:
      operationId: healthz
      summary: 健康检查
      responses:
        "200":
          description: OK
  /account/register:
    post:
      operationId: register
      summary: 注册账号（发送验证邮件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /account/verify:
    post:
      operationId: verifyEmail
      summary: 用邮件中的 token 验证邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: 已验证
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/forgot-password:
    post:
      operationId: forgotPassword
      summary: 发送密码重置邮件（不泄露账号是否存在）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "204":
          description: OK
  /account/reset-password:
    post:
      operationId: resetPassword
      summary: 用重置 token 设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: OK
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players:
    post:
      operationId: addPlayer
      summary: 为当前账号添加玩家名
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /oauth/{provider}/auth:
    get:
      operationId: oauthAuth
      summary: 跳转到第三方 OAuth 授权页
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: 登录完成后的前端回跳 URL
          schema:
            type: string
      responses:
        "302":
          description: 跳转到授权页
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      summary: OAuth 回调（state 为 URL 时 302 回跳并在 hash 携带 accessToken）
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 无回跳 URL 时直接返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "302":
          description: 回跳前端
  /mojang/oauth/auth:
    get:
      operationId: mojangOauthAuth
      summary: 获取 Microsoft 正版绑定授权 URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /mojang/oauth/callback:
    get:
      operationId: mojangOauthCallback
      summary: Microsoft 正版绑定回调
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已绑定
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /mojang/verify:
    post:
      operationId: mojangVerify
      summary: 正版账号验证
      security:
        - bearerAuth: []
      responses:
        "204":
          description: OK
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib:
    get:
      operationId: listSkinlib
      summary: 皮肤库列表（搜索/排序/分页）
      parameters:
        - name: q
          in: query
          required: false
          description: 关键词（匹配玩家名/描述）
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, likes]
            default: newest
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinLibPage"
    post:
      operationId: publishSkin
      summary: 把玩家当前皮肤发布到皮肤库
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerName]
              properties:
                playerName:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: 已发布
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinLibItem"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          description: 玩家或皮肤不存在
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "413":
          description: 超出发布数量配额
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /skinlib/{id}:
    get:
      operationId: getSkinlibItem
      summary: 皮肤库条目详情
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkinLibItem"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib/{id}/comments:
    get:
      operationId: listSkinComments
      summary: 条目评论列表（时间升序）
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkinComment"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib/{id}/apply:
    post:
      operationId: applySkin
      summary: 把皮肤库条目应用到自己名下的玩家
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerName]
              properties:
                playerName:
                  type: string
      responses:
        "204":
          description: 已应用
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib/{id}/like:
    post:
      operationId: likeSkin
      summary: 点赞皮肤
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: OK
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /skinlib/{id}/comment:
    post:
      operationId: commentSkin
      summary: 评论皮肤
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "204":
          description: OK
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /api/login-methods:
    get:
      operationId: getLoginMethods
      summary: 登录方式注册表（供前端渲染登录按钮）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginMethod"
  /api/announcement:
    get:
      operationId: getAnnouncement
      summary: 站点公告
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /api/admin/users:
    get:
      operationId: adminListUsers
      summary: 用户列表
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      summary: 更新用户角色/状态
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, admin]
                status:
                  type: string
                  enum: [active, banned, suspended]
      responses:
        "204":
          description: OK
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/login-methods:
    get:
      operationId: adminGetLoginMethods
      summary: 登录方式（管理视图）
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginMethod"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    put:
      operationId: adminSetLoginMethods
      summary: 保存登录方式开关/顺序
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [methods]
              properties:
                methods:
                  type: array
                  items:
                    $ref: "#/components/schemas/LoginMethod"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/announcement:
    get:
      operationId: adminGetAnnouncement
      summary: 公告（管理视图）
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    put:
      operationId: adminSetAnnouncement
      summary: 设置公告
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Announcement"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/invite-codes:
    post:
      operationId: adminGenerateInviteCodes
      summary: 生成邀请码（1–100 个）
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skinlib/{id}:
    delete:
      operationId: adminDeleteSkinlibItem
      summary: 删除皮肤库条目（审核）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/comments/{cid}:
    delete:
      operationId: adminDeleteComment
      summary: 删除皮肤库评论（审核）
      security:
        - adminToken: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/audit:
    get:
      operationId: adminListAudit
      summary: 管理操作审计日志（时间倒序）
      security:
        - adminToken: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries, total]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /reports:
    post:
      operationId: createReport
      summary: 举报皮肤条目或评论（登录用户；同一目标仅一次）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetID]
              properties:
                targetType:
                  type: string
                  enum: [skin, comment]
                targetID:
                  type: string
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: 已受理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: 重复举报
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /api/admin/reports:
    get:
      operationId: adminListReports
      summary: 举报列表（pending 优先；status 过滤 pending|dismissed|acted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reports, total]
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/reports/{id}/resolve:
    post:
      operationId: adminResolveReport
      summary: 标记举报处理结果（删除目标内容复用 skinlib/comments DELETE 端点）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [dismissed, acted]
      responses:
        "204":
          description: 已处理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins:
    get:
      operationId: adminListSkins
      summary: 管理端皮肤列表（status 过滤 listed|under_review|unlisted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkinLibItem"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins/{id}/status:
    post:
      operationId: adminSetSkinStatus
      summary: 设置皮肤条目状态（批准上架/下架/退回审核）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [listed, unlisted, under_review]
      responses:
        "204":
          description: 已更新
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /admin/batch-import:
    post:
      operationId: adminBatchImport
      summary: 批量导入用户（随机密码，需管理员 token）
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                      nickname:
                        type: string
                      playerName:
                        type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "403":
          $ref: "./common.yaml#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Yggdrasil accessToken（会话）
    adminToken:
      type: http
      scheme: bearer
      description: MIRROR_ADMIN_TOKEN
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, playerName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nickname:
          type: string
        playerName:
          type: string
        captchaToken:
          type: string
        inviteCode:
          type: string
    SkinLibItem:
      type: object
      required: [id, owner_user_id, player_name, texture_key, description, model, likes, status, created_at]
      properties:
        id:
          type: string
        owner_user_id:
          type: string
        player_name:
          type: string
        texture_key:
          type: string
        description:
          type: string
        model:
          type: string
          enum: [default, slim]
        likes:
          type: integer
        status:
          type: string
          enum: [listed, under_review, unlisted]
        created_at:
          type: string
          description: RFC3339 时间戳
    Report:
      type: object
      required: [id, reporter_user_id, reporter_name, target_type, target_id, reason, status, reviewed_by, created_at]
      properties:
        id:
          type: string
        reporter_user_id:
          type: string
        reporter_name:
          type: string
        target_type:
          type: string
          enum: [skin, comment]
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, dismissed, acted]
        reviewed_by:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
        reviewed_at:
          type: string
          description: RFC3339 时间戳（未处理时缺省）
    SkinLibPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkinLibItem"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
    SkinComment:
      type: object
      required: [id, item_id, user_id, author_name, content, created_at]
      properties:
        id:
          type: string
        item_id:
          type: string
        user_id:
          type: string
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AuditEntry:
      type: object
      required: [id, actor, actor_ip, action, target, detail, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
          description: '"token" 或 "user:<id>"'
        actor_ip:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AdminUser:
      type: object
      required: [id, email, nickname, role, status, verified, created_at, player_names]
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, banned, suspended]
        verified:
          type: boolean
        created_at:
          type: string
        player_names:
          type: array
          items:
            type: string
    LoginMethod:
      type: object
      required: [id, type, label, enabled, order]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [password, oauth]
        label:
          type: string
        enabled:
          type: boolean
        order:
          type: integer
    Announcement:
      type: object
      required: [title, body, enabled]
      properties:
        title:
          type: string
        body:
          type: string
        enabled:
          type: boolean
    Meta:
      type: object
      properties:
        meta:
          type: object
          properties:
            serverName:
              type: string
            implementationName:
              type: string
            implementationVersion:
              type: string
        skinDomains:
          type: array
          items:
            type: string
        signaturePublickey:
          type: string
          description: base64 编码的 PEM 公钥
    AuthenticateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        clientToken:
          type: string
        requestUser:
          type: boolean
          default: false
        agent:
          type: object
          properties:
            name:
              type: string
              default: Minecraft
            version:
              type: integer
    Profile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    Property:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
          description: base64 编码的 textures JSON
        signature:
          type: string
          description: base64 编码的 RSA 签名
    Textures:
      type: object
      description: textures 属性的解码结构
      properties:
        timestamp:
          type: integer
          format: int64
        profileId:
          type: string
        profileName:
          type: string
        textures:
          type: object
          properties:
            SKIN:
              type: object
              properties:
                url:
                  type: string
                metadata:
                  type: object
                  properties:
                    model:
                      type: string
                      enum: [slim, default]
            CAPE:
              type: object
              properties:
                url:
                  type: string
    Player:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        legacy:
          type: boolean
        demo:
          type: boolean
    AuthenticateResponse:
      type: object
      required: [accessToken, clientToken, availableProfiles]
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        availableProfiles:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
            properties:
              type: array
              items:
                $ref: "#/components/schemas/Property"
    RefreshRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
    ValidateRequest:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    InvalidateRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    SignoutRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    JoinRequest:
      type: object
      required:
        - accessToken
        - selectedProfile
        - serverId
      properties:
        accessToken:
          type: string
        selectedProfile:
          type: string
        serverId:
          type: string
