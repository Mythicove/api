openapi: 3.1.0
info:
  title: Mythic Mirror API
  version: 0.2.0
  description: |
    皮肤站契约，对齐 authlib-injector 的 Yggdrasil 服务端规范，外加账号体系、皮肤库与管理后台。

    本契约只描述当前后端真正实现的路由（受 mythic-mirror 仓库的 spec 漂移测试保护）。
    OIDC Provider 端点（/oauth2/*、/.well-known/*）遵循 OAuth2/OIDC 标准，
    自描述见 /.well-known/openid-configuration，暂不在本契约中重复建模。
servers:
  - url: /
paths:
  /:
    get:
      operationId: getMeta
      summary: 根 meta 端点
      description: 返回服务元信息，供客户端发现签名公钥与皮肤域名。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /authserver/authenticate:
    post:
      operationId: authenticate
      summary: 启动器认证（玩家名 + 独立密码）
      description: >-
        Yggdrasil 协议登录。username 是**玩家名**、password 是该玩家的**启动器独立密码**
        （ADR-0012）：网站主密码在此不被接受，邮箱也不能作用户名。因此管理员关闭主密码登录后
        启动器照常工作。玩家没有独立密码时一律 403——需先到网站的账号页生成一条。
        响应里的 availableProfiles/selectedProfile 只有认证到的那一个玩家：
        一条独立密码只证明它所属玩家的身份。
        403 的 errorMessage 可能是稳定错误码 `binding_required`
        （管理员强制绑定第三方而该账号尚未绑定）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/refresh:
    post:
      operationId: refresh
      summary: 刷新访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/validate:
    post:
      operationId: validate
      summary: 校验访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "204":
          description: 令牌有效
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/invalidate:
    post:
      operationId: invalidate
      summary: 使令牌失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvalidateRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /authserver/signout:
    post:
      operationId: signout
      summary: 退出登录（玩家名 + 独立密码）
      description: >-
        校验玩家名与该玩家的独立密码，成功后销毁**该玩家**的游戏会话。
        协议原文是"注销该账号所有令牌"，但凭证属于单个玩家，
        用一条玩家凭证去销毁同账号其他玩家的会话并不合理，故只清这一个玩家的；
        网站会话（player_id 为空）不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignoutRequest"
      responses:
        "204":
          description: OK
  /sessionserver/session/minecraft/join:
    post:
      operationId: join
      summary: 记录 serverId 会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /sessionserver/session/minecraft/hasJoined:
    get:
      operationId: hasJoined
      summary: 服务端换取玩家资料
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
        - name: serverId
          in: query
          required: true
          schema:
            type: string
        - name: ip
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 已加入，返回带签名的 profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 尚未加入
  /sessionserver/session/minecraft/profile/{uuid}:
    get:
      operationId: getProfile
      summary: 按 UUID 取 profile
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: unsigned
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "204":
          description: 无此 profile
  /api/profiles/minecraft:
    post:
      operationId: queryProfiles
      summary: 批量 name → UUID 查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10
              items:
                type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /skin/{name}:
    get:
      operationId: getSkin
      summary: 按玩家名下载皮肤
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadSkin
      summary: 上传皮肤（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
            enum: [default, slim]
            default: default
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "413":
          description: 超出存储配额（QuotaExceededException）
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /cape/{name}:
    get:
      operationId: getCape
      summary: 按玩家名下载披风
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: uploadCape
      summary: 上传披风（PNG 原始字节）
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: 已保存
        "401":
          $ref: "./common.yaml#/components/responses/Error"
  /textures/{key}:
    get:
      operationId: getTexture
      summary: 按存储键取纹理原图
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /avatars/{uuid}:
    get:
      operationId: getAvatar
      summary: crafatar 兼容 2D 头像
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: 头像边长（像素）
          schema:
            type: integer
            default: 128
      responses:
        "200":
          description: 头像 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /avatars/by-name/{name}:
    get:
      operationId: getAvatarByName
      summary: 按玩家名出 2D 头像（列表/评论等仅有名字的场景）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 128
      responses:
        "200":
          description: 头像 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/head/{uuid}:
    get:
      operationId: getHeadRender
      summary: 2D 头部渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /renders/body/{uuid}:
    get:
      operationId: getBodyRender
      summary: 2D 全身渲染
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /usm/{uuid}:
    get:
      operationId: getUSM
      summary: USM（统一皮肤材质）端点
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftSkins/{name}:
    get:
      operationId: getLegacySkin
      summary: 旧版皮肤直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 皮肤 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /MinecraftCloaks/{name}:
    get:
      operationId: getLegacyCape
      summary: 旧版披风直链（兼容 CSL 等）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 披风 PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /healthz:
    get:
      operationId: healthz
      summary: 健康检查
      responses:
        "200":
          description: OK
  /account/register:
    post:
      operationId: register
      summary: 注册账号（发送验证邮件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /account/login:
    post:
      operationId: accountLogin
      summary: web 登录（邮箱 + 主密码）
      description: |
        供 web BFF（`/api/auth/login` 路由处理器）调用，不是浏览器直接端点。
        与 Yggdrasil 的 /authserver/authenticate 的区别：这里校验的是**网站主密码**，
        且 `MIRROR_CAPTCHA_SCOPES` 含 login 时强制校验 captchaToken；
        启动器请走 /authserver/authenticate（玩家名 + 独立密码，永不强制验证码）。
        与 /authserver/authenticate、/oauth2/login/accept 共用按 IP 的 "auth" 限流桶。

        管理员在后台关掉「密码登录」后：账号密码注册立即关闭，主密码登录只对
        **尚未绑定第三方**的历史账号放行（宽限），已绑定的账号返回 403
        且 `error` 为稳定错误码 `password_login_disabled`。
        纯密码账号归零后主密码登录自然完全失效，无需再翻第二个开关。

        网站会话不代表任何玩家，故响应不含 profile 段；
        前端要显示/操作哪个玩家，从 GET /account/players 里选。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSession"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "503":
          $ref: "./common.yaml#/components/responses/Error"
  /account/verify:
    post:
      operationId: verifyEmail
      summary: 用邮件中的 token 验证邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: 已验证
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/forgot-password:
    post:
      operationId: forgotPassword
      summary: 发送密码重置邮件（不泄露账号是否存在）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "204":
          description: OK
  /account/reset-password:
    post:
      operationId: resetPassword
      summary: 用重置 token 设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: OK
        "400":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players:
    get:
      operationId: listPlayers
      summary: 当前账号名下玩家列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: addPlayer
      summary: 为当前账号添加玩家名
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          $ref: "./common.yaml#/components/responses/Error"
  /account/players/{name}:
    patch:
      operationId: renamePlayer
      summary: 玩家改名
      description: |
        离线 UUID 由名字派生，改名会同时更换 uuid，并使该玩家的游戏会话与服务器绑定失效
        （启动器需重新登录）。已绑定微软正版的玩家（名字来自 Mojang）返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 新名字
      responses:
        "200":
          description: 已改名
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          description: 新名字已被占用，或该玩家已绑定正版
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    delete:
      operationId: deletePlayer
      summary: 删除玩家（连同其会话与服务器绑定）
      description: 账号至少保留一个玩家，删除唯一玩家返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          description: 不能删除账号下唯一的玩家
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /account/players/{name}/credentials:
    get:
      operationId: listPlayerCredentials
      summary: 列出该玩家的启动器独立密码
      description: 只返回元数据（名称/创建时间/最近使用），永不返回哈希或明文。最近使用的排在前面。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerCredential"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: createPlayerCredential
      summary: 为该玩家新增一条启动器独立密码
      description: |
        启动器登录（/authserver/authenticate）只认玩家名 + 独立密码，故玩家至少要有一条才能进服。
        一个玩家至多 3 条（`account.MaxCredentialsPerPlayer`）：登录时要对候选哈希逐条做
        Argon2id，条数直接放大失败尝试的成本，而"每台设备一条"用不到更多。
        密码由用户自己输入，故响应不回显明文。
        可以与主密码相同——两者互不影响，启动器只会匹配到独立密码。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                  description: 用于在列表里区分多条凭证的标签（如"台式机"），不参与认证
                  maxLength: 64
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCredential"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
        "409":
          description: 条数已达上限
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /account/players/{name}/credentials/{credentialId}:
    delete:
      operationId: deletePlayerCredential
      summary: 撤销一条启动器独立密码
      description: 由该凭证建立的启动器会话经外键级联一并销毁（立刻掉线，不是等 24 小时过期）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PlayerName"
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已撤销
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /account/identities:
    get:
      operationId: listIdentities
      summary: 当前账号的第三方绑定与站点的强制绑定策略
      description: |
        `required` 来自管理员策略（PUT /api/admin/auth-policy）：为 true 且 identities 为空时，
        该账号不能用皮肤/皮肤库/启动器登录/SSO，前端据此弹绑定引导。
        绑定由第三方登录自动写入（首次按邮箱匹配到既有账号即完成绑定），本站不提供解绑：
        解绑会让"强制绑定"策略变成死锁。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingState"
        "401":
