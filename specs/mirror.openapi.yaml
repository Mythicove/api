                  type: string
                  enum: [skin, comment]
                targetID:
                  type: string
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "204":
          description: 已受理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          description: 目标不存在
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: 重复举报
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
  /api/admin/reports:
    get:
      operationId: adminListReports
      summary: 举报列表（pending 优先；status 过滤 pending|dismissed|acted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reports, total]
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/reports/{id}/resolve:
    post:
      operationId: adminResolveReport
      summary: 标记举报处理结果（删除目标内容复用 skinlib/comments DELETE 端点）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [dismissed, acted]
      responses:
        "204":
          description: 已处理
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins:
    get:
      operationId: adminListSkins
      summary: 管理端皮肤列表（status 过滤 listed|under_review|unlisted，空=全部）
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkinLibItem"
                  total:
                    type: integer
                    format: int64
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/skins/{id}/status:
    post:
      operationId: adminSetSkinStatus
      summary: 设置皮肤条目状态（批准上架/下架/退回审核）
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [listed, unlisted, under_review]
      responses:
        "204":
          description: 已更新
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
        "404":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/oauth-clients:
    get:
      operationId: adminListOAuthClients
      summary: 列出 OIDC 客户端
      description: |
        返回存储态客户端，含 `secret_hash`（sha256 hex，非明文）与 `first_party` 标记。
        读取者即能创建/轮换客户端的管理员，故不构成额外提权；但客户端密钥应使用高熵随机值，
        以免哈希被离线爆破。
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthClient"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    post:
      operationId: adminSaveOAuthClient
      summary: 新建或更新 OIDC 客户端（按 id upsert，整个对象覆盖）
      description: |
        按 `id` upsert：命中则**整条替换**，故更新时必须带上不想丢失的字段
        （包括 `secret_hash`；省略即视为清空/转 public）。
        `public: true` 时服务端强制清空 `secret_hash`。
        `first_party: true` 的客户端授权时跳过前端同意页（用于同部署自有服务，如 Hoard）。
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClient"
      responses:
        "201":
          description: 已保存（回显存储态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/oauth-clients/{id}:
    delete:
      operationId: adminDeleteOAuthClient
      summary: 删除 OIDC 客户端
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: 已删除
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /admin/batch-import:
    post:
      operationId: adminBatchImport
      summary: 批量导入用户（随机密码，需管理员 token）
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                      nickname:
                        type: string
                      playerName:
                        type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "403":
          $ref: "./common.yaml#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Yggdrasil accessToken（会话）
    adminToken:
      type: http
      scheme: bearer
      description: MIRROR_ADMIN_TOKEN
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    PlayerName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: 玩家名（当前账号名下）
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, playerName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nickname:
          type: string
        playerName:
          type: string
        captchaToken:
          type: string
        inviteCode:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        captchaToken:
          type: string
          description: login scope 启用时必填；其余场景忽略
    SkinLibItem:
      type: object
      required: [id, owner_user_id, player_name, texture_key, description, model, likes, status, created_at]
      properties:
        id:
          type: string
        owner_user_id:
          type: string
        player_name:
          type: string
        texture_key:
          type: string
        description:
          type: string
        model:
          type: string
          enum: [default, slim]
        likes:
          type: integer
        status:
          type: string
          enum: [listed, under_review, unlisted]
        created_at:
          type: string
          description: RFC3339 时间戳
    Report:
      type: object
      required: [id, reporter_user_id, reporter_name, target_type, target_id, reason, status, reviewed_by, created_at]
      properties:
        id:
          type: string
        reporter_user_id:
          type: string
        reporter_name:
          type: string
        target_type:
          type: string
          enum: [skin, comment]
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, dismissed, acted]
        reviewed_by:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
        reviewed_at:
          type: string
          description: RFC3339 时间戳（未处理时缺省）
    SkinLibPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkinLibItem"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
    SkinComment:
      type: object
      required: [id, item_id, user_id, author_name, content, created_at]
      properties:
        id:
          type: string
        item_id:
          type: string
        user_id:
          type: string
        author_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AuditEntry:
      type: object
      required: [id, actor, actor_ip, action, target, detail, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
          description: '"token" 或 "user:<id>"'
        actor_ip:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
        created_at:
          type: string
          description: RFC3339 时间戳
    AdminUser:
      type: object
      required: [id, email, nickname, role, status, verified, created_at, player_names]
      properties:
        id:
          type: string
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, banned, suspended]
        verified:
          type: boolean
        created_at:
          type: string
        player_names:
          type: array
          items:
            type: string
    RegisterRequirements:
      type: object
      required: [registrationDisabled, inviteOnly, captcha, captchaSiteKey, captchaCapUrl, captchaScopes, minPasswordLength, emailDomains]
      properties:
        registrationDisabled:
          type: boolean
        inviteOnly:
          type: boolean
        captcha:
          type: string
          description: turnstile | recaptcha | hcaptcha | cap | 空串（不启用）
        captchaSiteKey:
          type: string
        captchaCapUrl:
          type: string
          description: cap driver 的 Standalone 实例公网地址（前端加载控件用）；其余 driver 为空串
        captchaScopes:
          type: array
          description: 验证码保护范围（register | login）；前端据此决定注册/登录页是否渲染控件。验证码未生效时为空数组
          items:
            type: string
        minPasswordLength:
          type: integer
          description: 密码最小长度（与后端 account.MinPasswordLength 同源）
        emailDomains:
          type: array
          description: 允许的邮箱域名；空数组表示不限制
          items:
            type: string
    OAuthClient:
      type: object
      required: [id, name, redirect_uris, grant_types, scopes, public]
      properties:
        id:
          type: string
        name:
          type: string
        secret_hash:
          type: string
          description: 客户端密钥的 sha256 hex；public 客户端为空。服务端不存也不回传明文
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        public:
          type: boolean
        first_party:
          type: boolean
          description: 同部署第一方服务（如 Hoard）；授权时免前端同意页
    LoginMethod:
      type: object
      required: [id, type, label, enabled, order]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [password, oauth]
        label:
          type: string
        enabled:
          type: boolean
        order:
          type: integer
    LoginSession:
      type: object
      required: [accessToken, clientToken]
      properties:
        accessToken:
          type: string
          description: 网站会话令牌；由 BFF 写入 httpOnly cookie，不回浏览器脚本。
        clientToken:
          type: string
      description: >-
        web 登录（主密码）的结果。网站会话不代表任何玩家，故没有 profile 段；
        前端要显示/操作哪个玩家，从 GET /account/players 里选。
    PlayerCredential:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: 区分多条凭证的标签（如"台式机"），不参与认证
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: 最近一次用它登录启动器的时间；从未使用则省略
      description: 一条启动器独立密码的元数据。哈希与明文永不出现在任何响应里。
    Identity:
      type: object
      required: [provider, subject, created_at]
      properties:
        provider:
          type: string
          description: 第三方来源，如 github
        subject:
          type: string
          description: provider 侧的唯一标识
        email:
          type: string
        created_at:
          type: string
          format: date-time
    BindingState:
      type: object
      required: [identities, required]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        required:
          type: boolean
          description: 站点是否强制绑定第三方；为 true 且 identities 为空时功能受限
    AuthPolicy:
      type: object
      properties:
        require_third_party_binding:
          type: boolean
          description: 为 true 时未绑定第三方的账号不能用皮肤/皮肤库/启动器登录/SSO
        max_players:
          type: integer
          minimum: 1
          default: 1
          description: 单账号可创建的玩家数上限（存量超额账号不回收，只是不能再加）
      description: >-
        管理员可调的认证策略。主密码开关不在这里——它归 login_methods 的 `password` 项，
        一个开关只留一个入口。
    AuthPolicyView:
      allOf:
        - $ref: "#/components/schemas/AuthPolicy"
        - type: object
          required: [password_only_users]
          properties:
            password_only_users:
              type: integer
              description: >-
                还有多少历史纯密码账号（有主密码、无第三方绑定、已验证且状态正常）。
                关闭主密码登录后它们仍可登录（宽限），归零即代表主密码登录已自然失效。
                只服务管理面板的决策提示，不在登录热路径上计算。
    Announcement:
      type: object
      required: [title, body, enabled]
      properties:
        title:
          type: string
        body:
          type: string
        enabled:
          type: boolean
    BrandConfig:
      type: object
      required: [light, dark, version]
      properties:
        light:
          type: boolean
          description: 浅色图标是否被自定义
        dark:
          type: boolean
          description: 深色图标是否被自定义
        version:
          type: integer
          description: 变更版本号，前端用作缓存击穿查询串
    SiteInfo:
      type: object
      required: [name, description, copyright, icp]
      properties:
        name:
          type: string
        description:
          type: string
        copyright:
          type: string
        icp:
          type: string
          description: 备案展示文本（中国部署）
    SiteAssets:
      type: object
      required: [customCss, customJs]
      properties:
        customCss:
          type: string
        customJs:
          type: string
    SitePublic:
      type: object
      required: [name, description, copyright, icp, customCss, customJs]
      properties:
        name:
          type: string
        description:
          type: string
        copyright:
          type: string
        icp:
          type: string
        customCss:
          type: boolean
        customJs:
          type: boolean
    SiteAdmin:
      type: object
      required: [info, assets]
      properties:
        info:
          $ref: "#/components/schemas/SiteInfo"
        assets:
          $ref: "#/components/schemas/SiteAssets"
    RegistrationPolicy:
      type: object
      required: [disableRegistration, inviteOnly, emailDomainWhitelist, captchaScopes]
      properties:
        disableRegistration:
          type: boolean
        inviteOnly:
          type: boolean
        emailDomainWhitelist:
          type: array
          description: 允许的邮箱域名；空数组=不限制
          items:
            type: string
        captchaScopes:
          type: array
          description: 验证码保护范围（register | login）；空数组=不保护
          items:
            type: string
    Meta:
      type: object
      properties:
        meta:
          type: object
          properties:
            serverName:
              type: string
            implementationName:
              type: string
            implementationVersion:
              type: string
        skinDomains:
          type: array
          items:
            type: string
        signaturePublickey:
          type: string
          description: >-
            公钥的 **PEM 文本**（`-----BEGIN PUBLIC KEY-----` 开头，含换行）。
            不做 base64 包装：authlib-injector 直接按 PEM 解析这个字段，
            多包一层 base64 会让它报 "Bad signature public key" 并放弃注入，
            客户端因此认不到本站皮肤。
    AuthenticateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: "**玩家名**（不是邮箱）。启动器登录按玩家名定位玩家。"
        password:
          type: string
          description: 该玩家的**启动器独立密码**（见 /account/players/{name}/credentials）；网站主密码在此无效。
        clientToken:
          type: string
        requestUser:
          type: boolean
          default: false
        agent:
          type: object
          properties:
            name:
              type: string
              default: Minecraft
            version:
              type: integer
    Profile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    Property:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
          description: base64 编码的 textures JSON
        signature:
          type: string
          description: base64 编码的 RSA 签名
    Textures:
      type: object
      description: textures 属性的解码结构
      properties:
        timestamp:
          type: integer
          format: int64
        profileId:
          type: string
        profileName:
          type: string
        textures:
          type: object
          properties:
            SKIN:
              type: object
              properties:
                url:
                  type: string
                metadata:
                  type: object
                  properties:
                    model:
                      type: string
                      enum: [slim, default]
            CAPE:
              type: object
              properties:
                url:
                  type: string
    Player:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        legacy:
          type: boolean
        demo:
          type: boolean
        premium:
          type: boolean
          description: 是否已绑定微软正版（绑定后不可本地改名）
    AuthenticateResponse:
      type: object
      required: [accessToken, clientToken, availableProfiles]
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        availableProfiles:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
            properties:
              type: array
              items:
                $ref: "#/components/schemas/Property"
    RefreshRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
        selectedProfile:
          $ref: "#/components/schemas/Player"
        user:
          type: object
          properties:
            id:
              type: string
    ValidateRequest:
      type: object
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    InvalidateRequest:
      type: object
      required:
        - accessToken
        - clientToken
      properties:
        accessToken:
          type: string
        clientToken:
          type: string
    SignoutRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: "**玩家名**（不是邮箱）"
        password:
          type: string
          description: 该玩家的启动器独立密码；主密码在此无效
    JoinRequest:
      type: object
      required:
        - accessToken
        - selectedProfile
        - serverId
      properties:
        accessToken:
          type: string
        selectedProfile:
          type: string
        serverId:
          type: string
