  /api/admin/login-methods:
    get:
      operationId: adminGetLoginMethods
      summary: 登录方式（管理视图）
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginMethod"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    put:
      operationId: adminSetLoginMethods
      summary: 保存登录方式开关/顺序
      description: |
        `password` 开关是**强制生效**的（此前只是给前端渲染按钮用的装饰）：关闭后
        /account/login、/oauth2/login/accept 拒绝主密码，账号密码注册一并关闭，
        前端登录页不再渲染密码表单。未绑定第三方的历史账号仍可用主密码登录（宽限），
        直到它们绑定第三方或消失——见 GET /api/admin/auth-policy 的 password_only_users。
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [methods]
              properties:
                methods:
                  type: array
                  items:
                    $ref: "#/components/schemas/LoginMethod"
      responses:
        "204":
          description: OK
        "403":
          $ref: "./common.yaml#/components/responses/Error"
  /api/admin/auth-policy:
    get:
      operationId: adminGetAuthPolicy
      summary: 认证策略 + 纯密码账号计数
      description: |
        `password_only_users` 是"还有多少历史纯密码账号"（有主密码、无第三方绑定、
        已验证且状态正常）。它只是给管理员做决策的提示：关闭主密码登录后这些账号
        仍可登录（宽限），归零即代表主密码登录已自然失效，不需要再翻第二个开关。
        计数只在打开面板时算（走 `users_password_only` 部分索引），不进登录热路径——
        热路径上的判定是"这个账号自己有没有绑定"，登录时本来就要读用户行。
      security:
        - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyView"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
    put:
      operationId: adminSetAuthPolicy
      summary: 保存认证策略（强制绑定 / 玩家数上限）
      description: >-
        主密码开关不在此处：它归 login_methods，一个开关只留一个入口，
        避免"面板关了但策略还开着"。请求体里的 password_login 字段会被忽略。
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPolicy"
      responses:
        "204":
          description: OK
        "400":
          $ref: "./common.yaml#/components/responses/Error"
        "403":
          $ref: "./common.yaml#/components/responses/Error"
